<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AdminAX Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col">
    <header class="bg-white border-b p-4 font-bold text-blue-600">AdminAX AI Chat</header>
    <main id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4"></main>
    <footer class="p-4 bg-white border-t">
        <div class="flex gap-2">
            <input type="text" id="chat-input" class="flex-1 border rounded-lg px-4 py-2" placeholder="메시지를 입력하세요...">
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">전송</button>
        </div>
    </footer>
    <script src="/js/chat.js"></script>
</body>
</html>
