<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdminAX - Intelligent Document AI</title>
    <script src="/lib/tailwind/tailwind.min.js"></script>
    <script src="/lib/sweetalert2/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

        body {
            font-family: 'Pretendard', sans-serif;
        }

        /* Swal 팝업 시 화면 틀어짐/스크롤 추가 방지 */
        html.swal2-shown,
        body.swal2-shown {
            height: 100vh !important;
            padding-right: 0 !important;
            overflow: hidden !important;
        }

        .session-active {
            background-color: #f1f5f9;
            border-left: 4px solid #3b82f6;
            color: #2563eb;
        }

        .dropzone-active {
            border: 2px dashed #3b82f6;
            background-color: #eff6ff;
        }

        #chat-window::-webkit-scrollbar {
            width: 5px;
        }

        #chat-window::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 h-screen flex overflow-hidden">

    <div id="global-drop-overlay"
        class="fixed inset-0 z-50 bg-blue-600/10 backdrop-blur-[2px] border-4 border-dashed border-blue-500 flex items-center justify-center hidden pointer-events-none">
        <div class="bg-white p-10 rounded-3xl shadow-2xl text-center scale-110 transition-transform">
            <i class="fa-solid fa-cloud-arrow-up text-6xl text-blue-600 mb-4 animate-bounce"></i>
            <p class="text-2xl font-bold text-slate-800">분석할 파일을 여기에 놓으세요</p>
            <p class="text-slate-400 mt-2 text-sm">PDF, DOCX, XLSX 지원</p>
        </div>
    </div>

    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col z-20">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-xl font-bold text-blue-600 italic mb-4">AdminAX</h1>

            <div class="relative mb-4">
                <i
                    class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]"></i>
                <input type="text" id="sidebar-search" placeholder="세션 또는 문서 검색..."
                    class="w-full bg-slate-100 border-none rounded-lg py-2.5 pl-9 pr-4 text-xs focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <div class="flex gap-2">
                <button id="new-chat-btn"
                    class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-blue-700 transition-all shadow-md">
                    <i class="fa-solid fa-plus mr-1"></i> 새 대화
                </button>
                <button id="add-folder-btn"
                    class="px-3.5 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-xs hover:bg-slate-200 transition-all"
                    title="폴더 추가">
                    <i class="fa-solid fa-folder-plus"></i>
                </button>
            </div>
        </div>

        <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-4 space-y-6">
        </nav>

        <div class="p-5 border-t border-slate-100 bg-slate-50/50">
            <div class="flex items-center gap-3">
                <div
                    class="w-9 h-9 rounded-xl bg-blue-500 text-white flex items-center justify-center text-xs font-bold shadow-sm">
                    DI</div>
                <div class="text-[11px] leading-tight">
                    <p class="font-bold text-slate-800">Kwon Do-il</p>
                    <p class="text-slate-500 mt-0.5">WELLCONN · Management Support</p>
                </div>
            </div>
        </div>
    </aside>

    <main id="chat-main-area" class="flex-1 flex flex-col bg-white overflow-hidden relative">
        <header
            class="h-16 border-b border-slate-100 flex items-center justify-between px-8 bg-white/80 backdrop-blur-md z-10">
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <span id="current-title" class="font-bold text-slate-800">세션을 선택하거나 새로 시작하세요</span>
                    <span id="session-uuid" class="text-[9px] text-slate-300 font-mono mt-0.5 tracking-tighter"></span>
                </div>
                <div id="session-badge-container" class="flex gap-2 mt-0.5">
                    <span id="session-type-badge"
                        class="hidden text-[9px] font-bold text-blue-500 px-1.5 py-0.5 bg-blue-50 rounded"></span>
                </div>
            </div>
            <div class="flex gap-5 text-slate-400">
                <i class="fa-solid fa-clock-rotate-left cursor-pointer hover:text-blue-600 transition-colors"></i>
                <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-blue-600 transition-colors"></i>
            </div>
        </header>

        <div id="chat-window" class="flex-1 overflow-y-auto p-8 space-y-8 bg-slate-50/20">
            <div class="h-full flex flex-col items-center justify-center text-slate-300 space-y-4">
                <i class="fa-solid fa-robot text-6xl opacity-20"></i>
                <p class="text-sm font-medium">분석할 문서를 업로드하거나 대화를 시작하세요</p>
            </div>
        </div>

        <footer class="p-6 bg-white border-t border-slate-100">
            <div id="input-container" class="max-w-4xl mx-auto relative transition-all duration-200">
                <div id="file-list-preview" class="hidden mb-4 flex flex-wrap gap-2"></div>

                <div id="input-box-wrapper"
                    class="relative group rounded-2xl border border-slate-200 bg-slate-100 focus-within:bg-white focus-within:ring-4 focus-within:ring-blue-50 focus-within:border-blue-400 transition-all">
                    <div class="absolute left-4 top-4 flex gap-3 text-slate-400">
                        <label for="file-input" class="cursor-pointer hover:text-blue-500 transition-colors">
                            <i class="fa-solid fa-paperclip text-lg"></i>
                        </label>
                        <input type="file" id="file-input" class="hidden" multiple>
                    </div>

                    <textarea id="chat-input" rows="1" placeholder="질문을 입력하세요..."
                        class="w-full bg-transparent border-none py-4 pl-12 pr-16 outline-none text-sm resize-none max-h-48 leading-relaxed"></textarea>

                    <button id="send-btn"
                        class="absolute right-3 bottom-3 bg-blue-600 text-white p-2.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>
        </footer>
    </main>

    <script src="/js/chat.js"></script>
</body>

</html>
