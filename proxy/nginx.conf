events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 50M;

    # 업스트림 설정
    upstream engine_server {
        server adminax-core:8080;
    }

    upstream admin_ui_server {
        server adminax-admin-ui:8081; # 관리자용 스프링 부트
    }

    upstream chat_ui_server {
        server adminax-chat-ui:8080; # 채팅용 익스프레스
    }

    server {
        listen 80;

        # 1. 관리자 UI (Spring Boot)
        # /admin/으로 시작하는 요청을 처리
        location /admin/ {
            proxy_pass http://admin_ui_server;
            
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # 관리자 페이지 내의 리소스 처리를 위한 설정
            proxy_redirect off;
        }

        # 2. Core API 요청 (Spring Boot)
        location /api/ {
            proxy_pass http://engine_server;
            
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 지원 (채팅/알림용)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. 사용자 채팅 UI (Express)
        # 그 외 모든 요청(/)을 채팅 UI로 전달
        location / {
            proxy_pass http://chat_ui_server;
            
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Express에서 정적 파일이나 라우팅이 꼬이지 않도록 기본 설정 유지
        }
    }
}