services:
  # 1. Database (Metadata)
  db:
    image: postgres:15-alpine
    container_name: adminax-db
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512M
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"

  # 2. Search Engine (Vector DB)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: adminax-es
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE} -Xmx${ES_HEAP_SIZE}
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT}
    logging: *default-logging

  # 3. Message Broker (Redis Streams)
  adminax-redis:
    image: redis:7-alpine
    container_name: adminax-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      - TZ=${TZ}
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT}
    logging: *default-logging

  # Redis 모니터링 UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: adminax-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:adminax-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - adminax-redis
    logging: *default-logging

  # 4. Core Engine (Spring Boot)
  core-engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: adminax-core
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - JAVA_OPTS=${JAVA_OPTS}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_REDIS_HOST=adminax-redis
      - API_SERVER_PORT=${API_SERVER_PORT}
      - API_SERVER_CONTEXT=${API_SERVER_CONTEXT}
    depends_on:
      - db
      - elasticsearch
      - adminax-redis
    volumes:
      - ./shared-docs:/app/shared-docs
    deploy:
      resources:
        limits:
          memory: ${CORE_MEM_LIMIT}
    logging: *default-logging

  # 5. Converter Worker (비즈니스 로직 담당)
  converter-worker:
    build:
      context: ./converter
      dockerfile: Dockerfile
    container_name: adminax-converter
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - REDIS_HOST=adminax-redis
      - ADAPTER_URL=http://adminax-adapter:8000/generate
    volumes:
      - ./converter:/app
      - ./shared-docs:/app/shared-docs
    depends_on:
      - adminax-redis
      - adapter-layer
    deploy:
      resources:
        limits:
          memory: ${CONVERTER_MEM_LIMIT}
    logging: *default-logging

  # 5.1 FastAPI Adapter Layer (MoE 및 모델 중계)
  adapter-layer:
    build:
      context: ./adapter
      dockerfile: Dockerfile
    container_name: adminax-adapter
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ}
      - REDIS_HOST=adminax-redis
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - OLLAMA_HOST=http://ollama:11434
      - LOCAL_MODEL_SECRET=${LOCAL_MODEL_SECRET}
      - HF_API_TOKEN=${HF_API_TOKEN}
    depends_on:
      - adminax-redis
      - db
      - ollama
    volumes:
      - ./adapter:/app
    deploy:
      resources:
        limits:
          memory: ${ADAPTER_MEM_LIMIT}
    logging: *default-logging

  # 5.2 Ollama (Inference Engine)
  ollama:
    image: ollama/ollama:latest
    container_name: adminax-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT}
        # 나중에 GPU를 장착하면 아래 주석을 해제.
        # reservations:
        #   devices:
        #     - driver: "${OLLAMA_GPU_DRIVER}"
        #       count: ${OLLAMA_GPU_COUNT:-0}
        #       capabilities: [gpu]
    logging: *default-logging

  # Ollama 관리 및 테스트용 대시보드
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: adminax-open-webui
    restart: "unless-stopped" # 서버 시작 시 자동 실행 안 함 (필요할 때만 수동으로 켬)
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://adminax-ollama:11434
      - WEBUI_SECRET_KEY=adminax_secret_key
    volumes:
      - ./data/webui:/app/backend/data
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *default-logging

  # 6. Admin UI
  admin-ui:
    build:
      context: ./admin-ui
    container_name: adminax-admin-ui
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=prod
      - CORE_ENGINE_URL=http://core-engine:8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    depends_on:
      - core-engine
      - db
    deploy:
      resources:
        limits:
          memory: ${ADMIN_UI_MEM_LIMIT}
    logging: *default-logging

  # 7. Chat UI
  chat-ui:
    build:
      context: ./chat-ui
    container_name: adminax-chat-ui
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - ENGINE_URL=http://core-engine:8080
    depends_on:
      - core-engine
    deploy:
      resources:
        limits:
          memory: ${CHAT_UI_MEM_LIMIT}
    logging: *default-logging

  # 8. API Gateway (Nginx)
  gateway:
    image: nginx:stable-alpine
    container_name: adminax-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-ui
      - admin-ui
      - core-engine
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEM_LIMIT}
    logging: *default-logging

# 최하단 네트워크 설정 (들여쓰기 주의)
networks:
  default:
    name: adminax-network